apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: core-client-service
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`appsdev.devfheral.dev`) && PathPrefix(`/api/v1/customers`)
      kind: Rule
      middlewares:
        - name: apps-forwardauth
          namespace: apps
      services:
        - name: core-client-service
          port: 8080
  tls: {}
