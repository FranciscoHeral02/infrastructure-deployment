apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: security

data:
  configuration.yml: |
    theme: dark

    server:
      address: 'tcp://0.0.0.0:9091'

    log:
      level: info

    telemetry:
      metrics:
        enabled: true

    authentication_backend:
      file:
        path: /config/users_database.yml

    access_control:
      default_policy: deny

      rules:
        - domain: '*.devfheral.dev'
          policy: one_factor

    session:
      name: authelia_session

      secret: '{{ env "AUTHELIA_SESSION_SECRET" }}'

      expiration: 1h
      inactivity: 5m

      cookies:
        - domain: 'devfheral.dev'
          authelia_url: 'https://auth.devfheral.dev'
          default_redirection_url: 'https://devfheral.dev'

      redis:
        host: redis.cache.svc.cluster.local
        port: 6379
        password: '{{ env "AUTHELIA_REDIS_PASSWORD" }}'

    regulation:
      max_retries: 3
      find_time: 2 minutes
      ban_time: 10 minutes

    storage:
      encryption_key: '{{ env "AUTHELIA_STORAGE_ENCRYPTION_KEY" }}'

      postgres:
        address: 'tcp://postgres-internal.databases.svc.cluster.local:5432'
        database: 'authelia'
        username: 'authelia_user'
        password: '{{ env "AUTHELIA_POSTGRES_PASSWORD" }}'

    notifier:
      filesystem:
        filename: /config/notification.txt

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-users
  namespace: security

data:
  users_database.yml: |
    users:
      admin:
        displayname: "Admin"
        password: "$argon2id$v=19$m=65536,t=3,p=4$nWGH2Fv9A6NgfEPMUPyyZw$Ze4m5US+BZq1ifLRai1jxgqAlFRfEj/TFocHmNPgiK4"
        email: francisco.heral02@gmail.com
        groups:
          - admins

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: security

spec:
  replicas: 1

  selector:
    matchLabels:
      app: authelia

  template:
    metadata:
      labels:
        app: authelia

    spec:
      containers:
        - name: authelia
          image: authelia/authelia:latest

          ports:
            - containerPort: 9091
              name: http

          envFrom:
            - secretRef:
                name: security-secrets

          volumeMounts:
            - name: config
              mountPath: /config/configuration.yml
              subPath: configuration.yml

            - name: users
              mountPath: /config/users_database.yml
              subPath: users_database.yml

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /api/health
              port: 9091

            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/health
              port: 9091

            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config
          configMap:
            name: authelia-config

        - name: users
          configMap:
            name: authelia-users

---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: security

spec:
  type: ClusterIP

  selector:
    app: authelia

  ports:
    - name: http
      port: 9091
      targetPort: 9091

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: security

spec:
  forwardAuth:
    address: http://authelia.security.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true

    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authelia
  namespace: security

spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`auth.devfheral.dev`)
      kind: Rule

      services:
        - name: authelia
          port: 9091

  tls:
    secretName: wildcard-tls
