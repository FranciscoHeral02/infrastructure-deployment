apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: security

spec:
  replicas: 1

  selector:
    matchLabels:
      app: authelia

  template:
    metadata:
      labels:
        app: authelia

    spec:
      containers:
        - name: authelia
          image: authelia/authelia:latest

          ports:
            - containerPort: 9091

          envFrom:
            - secretRef:
                name: security-secrets

          volumeMounts:
            - name: config
              mountPath: /config

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /api/health
              port: 9091

            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/health
              port: 9091

            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: authelia-config
              - configMap:
                  name: authelia-users
