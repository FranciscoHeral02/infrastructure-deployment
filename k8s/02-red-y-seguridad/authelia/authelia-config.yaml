apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: security

data:
  configuration.yml: |
    server:
      address: tcp://0.0.0.0:9091
      
    telemetry:
      metrics:
        enabled: true
    log:
      level: info

    authentication_backend:
      file:
        path: /config/users_database.yml

    access_control:
      default_policy: deny
      rules:
        - domain: auth.devfheral.dev
          policy: bypass
        - domain: "*.devfheral.dev"
          policy: one_factor

    session:
      secret: "${AUTHELIA_SESSION_SECRET}"
      
      cookies:
        - domain: devfheral.dev
          authelia_url: https://auth.devfheral.dev
    
          default_redirection_url: https://devfheral.dev
          
      redis:
        host: redis.cache.svc.cluster.local
        port: 6379
        password: "${REDIS_PASSWORD}"

    storage:
      encryption_key: "${AUTHELIA_STORAGE_ENCRYPTION_KEY}"

      postgres:
        address: tcp://pgbouncer.databases.svc.cluster.local:6432
    
        database: authelia
    
        username: authelia_user
        password: "${AUTHELIA_POSTGRES_PASSWORD}"
    
        schema: public

    notifier:
      filesystem:
        filename: /config/notification.txt
