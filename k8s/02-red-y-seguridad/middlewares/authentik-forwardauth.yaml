apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: kube-system

spec:
  forwardAuth:
    address: https://auth.devfheral.dev/outpost.goauthentik.io/auth/traefik

    trustForwardHeader: true

    authResponseHeaders:
      - X-authentik-username
      - X-authentik-email
      - X-authentik-groups
      - X-authentik-name
      - X-authentik-uid
